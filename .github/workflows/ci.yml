name: CI

# Runs on every push to main, on every pull request,
# and when you press "Run workflow" on the Actions tab.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # 1. Unit tests, including tests against a real PostgreSQL database
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: payments
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: payments
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payments"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements*.txt
      - name: Install dependencies
        run: pip install -r app/requirements.txt -r app/requirements-dev.txt
      - name: Run tests
        env:
          TEST_DB_HOST: localhost
          TEST_DB_PASSWORD: test-password
        run: pytest -v app/tests

  # 2. Build the Docker image and check the Kubernetes files are valid
  build:
    name: Build image and validate manifests
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t payments-api:${{ github.sha }} app
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Kubernetes manifests
        run: |
          pip install kubernetes-validate==1.36.0
          kubernetes-validate --strict k8s/*.yaml k8s/monitoring/*.yaml k8s/drills/*.yaml

  # 3. Create a real Kubernetes cluster (k3d), deploy, and run the failure drills
  e2e:
    name: Deploy to Kubernetes and run failure drills
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install k3d
        run: curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | TAG=v5.7.4 bash
      - name: Create cluster and deploy everything
        run: python scripts/cluster.py up
      - name: Smoke test the API
        run: |
          curl -sf -X POST http://localhost:8080/payments \
            -H "Content-Type: application/json" \
            -d '{"amount": "12.50", "currency": "SGD", "description": "CI smoke test"}'
          echo
          curl -sf http://localhost:8080/payments
      - name: Run failure drills
        run: |
          echo "## Failure drill results" >> "$GITHUB_STEP_SUMMARY"
          python scripts/drills.py all
      - name: Save drill results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drill-results
          path: drills/results.md
          if-no-files-found: ignore
      - name: Show cluster state (only if something failed)
        if: failure()
        run: |
          kubectl --context k3d-payments get pods,hpa,svc,pvc -n payments -o wide
          kubectl --context k3d-payments get events -n payments --sort-by=.lastTimestamp | tail -40
          kubectl --context k3d-payments logs -n payments -l app=payments-api --tail=40 --prefix
      - name: Delete cluster
        if: always()
        run: python scripts/cluster.py down
