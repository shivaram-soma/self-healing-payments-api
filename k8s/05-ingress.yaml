# Exposes ONLY /payments outside the cluster, through k3s's built-in
# Traefik ingress. /admin, /health, /ready and /metrics stay internal.
# k3d maps http://localhost:8080 on your machine to this ingress.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: payments-api
  namespace: payments
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /payments
            pathType: Prefix
            backend:
              service:
                name: payments-api
                port:
                  name: http
