# EXAMPLE ONLY - this file is NOT applied.
#
# The real Secret is created by `python scripts/cluster.py up` with a random
# password, so no password is ever committed to Git. To create it by hand:
#
#   kubectl create secret generic db-credentials -n payments \
#     --from-literal=password=<choose-a-password>
#
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: payments
type: Opaque
stringData:
  password: "change-me"
