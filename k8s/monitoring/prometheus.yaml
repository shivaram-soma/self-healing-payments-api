# A single, small Prometheus that scrapes the payments-api pods and
# evaluates alert rules. Open it with:
#   kubectl port-forward -n payments svc/prometheus 9090:9090
# then visit http://localhost:9090 (Alerts tab shows the rules below).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: payments
---
# Permission to discover pods in this namespace only (least privilege).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus
  namespace: payments
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus
  namespace: payments
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: payments
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: payments
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/alerts.yml

    scrape_configs:
      - job_name: payments-api
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [payments]
        relabel_configs:
          # keep only pods annotated prometheus.io/scrape: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          # use the path from the prometheus.io/path annotation
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          # use the port from the prometheus.io/port annotation
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          # add a readable "pod" label to every series
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

  alerts.yml: |
    groups:
      - name: payments-api
        rules:
          - alert: PaymentsHighErrorRate
            expr: |
              sum(rate(http_requests_total{job="payments-api", status=~"5.."}[2m]))
                /
              sum(rate(http_requests_total{job="payments-api"}[2m]))
                > 0.05
            for: 1m
            labels:
              severity: page
            annotations:
              summary: "More than 5% of payment requests are failing"
              runbook: "docs/runbook.md#paymentshigherrorrate"

          - alert: PaymentsApiPodDown
            expr: up{job="payments-api"} == 0
            for: 30s
            labels:
              severity: page
            annotations:
              summary: "Prometheus cannot scrape pod {{ $labels.pod }}"
              runbook: "docs/runbook.md#paymentsapipoddown"

          - alert: PaymentsApiRestarted
            expr: changes(process_start_time_seconds{job="payments-api"}[10m]) > 0
            labels:
              severity: ticket
            annotations:
              summary: "Pod {{ $labels.pod }} restarted in the last 10 minutes"
              runbook: "docs/runbook.md#paymentsapirestarted"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: payments
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=1d
          ports:
            - name: web
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: web
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: {}         # metrics are kept for this session only
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: payments
spec:
  selector:
    app: prometheus
  ports:
    - name: web
      port: 9090
      targetPort: web
